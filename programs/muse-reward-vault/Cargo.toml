[package]
name = "muse-reward-vault"
version = "0.1.0"
description = "Non-custodial research reward vault for Muse Solves Cancer"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "muse_reward_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
